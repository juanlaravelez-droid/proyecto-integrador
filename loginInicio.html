<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soluciones de energía solar para tu hogar. Kits residenciales 3-5 kWp, sistemas Off-Grid y asesoría gratuita. Reduce tu factura eléctrica hasta 85%. ¡Cotiza gratis!">
  <title>Paneles Solares en Colombia | Kits Solares 3-5 kWp | Luma Verde</title>

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="estilos.css">

  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Luma Verde",
      "description": "Soluciones de energía solar residencial y empresarial",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[Dirección]",
        "addressLocality": "[Ciudad]",
        "addressCountry": "CO"
      },
      "telephone": "[Teléfono]",
      "url": "https://lumaverde.com",
      "image": "img/LOGO2.png",
    }
  </script>
</head>
<body>
  <!-- Header -->
  <header class="bg-light py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="d-flex align-items-center text-decoration-none">
        <img src="img/LOGO2.png" alt="Luma Verde Logo" width="50" height="50" class="me-2">
        <span class="h4 mb-0" style="color: #034425;">Luma Verde</span>
      </a>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a href="#servicios" class="nav-link">Servicios</a></li>
          <li class="nav-item"><a href="#contacto" class="nav-link">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

<section class="py-5" style="background-color: #f4faf6;">
  <div class="container">
    <h3 class="text-center mb-4" style="color: #034425;">¿Cómo deseas ingresar?</h3>

    <div class="row g-4 justify-content-center">

      <!-- Card Cliente -->
      <div class="col-12 col-md-5">
        <a href="login.html" class="text-decoration-none">
          <div class="card h-100 text-center"
               style="border: 2px solid #047456; border-radius: 10px; cursor: pointer; transition: transform 0.2s;">
            <div class="card-body py-5" style="background-color: #c0d0c9;">
              <div class="mb-3" style="font-size: 3rem;">👤</div>
              <h5 class="card-title fw-bold" style="color: #034425;">Cliente</h5>
              <p class="card-text" style="font-size: 0.9rem; color: #555;">
                Consulta tus pedidos, facturas y estado de instalación.
              </p>
            </div>
          </div>
        </a>
      </div>

      <!-- Card Empleado -->
      <div class="col-12 col-md-5">
        <a href="loginInicio.html" class="text-decoration-none">
          <div class="card h-100 text-center"
               style="border: 2px solid #047456; border-radius: 10px; cursor: pointer; transition: transform 0.2s;">
            <div class="card-body py-5" style="background-color: #c0d0c9;">
              <div class="mb-3" style="font-size: 3rem;">🧑‍💼</div>
              <h5 class="card-title fw-bold" style="color: #034425;">Empleado</h5>
              <p class="card-text" style="font-size: 0.9rem; color: #555;">
                Accede al panel de gestión, inventario y clientes.
              </p>
            </div>
          </div>
        </a>
      </div>

    </div>
  </div>
</section>
<!-- Footer -->
<footer class="text-center text-white" style="background-color: #034425;">
  <div class="container p-4 pb-0">
    <!-- Newsletter Section -->
    <section class="mb-4">
      <form action="">
        <div class="row d-flex justify-content-center">
          <div class="col-auto">
            <p class="pt-2">
              <strong>Regístrate para nuestro boletín</strong>
            </p>
          </div>

          <div class="col-md-5 col-12">
            <div class="form-outline form-white mb-4">
              <input type="email" id="newsletter-email" class="form-control" placeholder="Tu correo" required>
              <label class="form-label" for="newsletter-email">Correo Electrónico</label>
            </div>
          </div>

          <div class="col-auto">
            <button type="submit" class="btn btn-outline-light mb-4">
              Suscribirse
            </button>
          </div>
        </div>
      </form>
    </section>
  </div>

  <!-- Copyright -->
  <div class="text-center p-3" style="background-color: #027340;">
    © 2024 Luma Verde - Soluciones de Energía Solar
  </div>
</footer>
<div class="container my-5">

<!-- End of .container -->
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"></script>
</body>
</html>
